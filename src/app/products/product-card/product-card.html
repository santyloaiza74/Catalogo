<article class="card"
         (click)="selected.emit(product().id)">
  <img [src]="product().thumbnail"
       [alt]="product().title" />
  <h3>{{ product().title }}</h3>
  <p class="brand">{{ product().brand }}</p>
  <p class="price">
    {{ product().price | currency }}
  </p>
  <span>★ {{ product().rating }}</span>
</article>
